version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install
    build:
      commands:
        - npm run build
  artifacts: # MUST be indented exactly like 'phases'
    baseDirectory: .next # Change to 'build' or '.next' depending on your framework
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*